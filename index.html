<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Planificador de Comida Semanal</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f8; color: #2d3748; margin: 0; padding: 12px; }
    .container { max-width: 800px; background: #ffffff; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin: 0 auto; }
    h1 { color: #1a202c; text-align: center; margin-top: 5px; margin-bottom: 20px; font-size: 1.5rem; font-weight: 700; }
    h2 { color: #2b6cb0; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; margin-top: 24px; font-size: 1.1rem; font-weight: 600; }
    
    /* Selector de País */
    .country-group { display: flex; align-items: center; justify-content: space-between; background: #fffaf0; padding: 14px 18px; border-radius: 12px; border: 1px solid #feebc8; margin-bottom: 12px; }
    .country-label { font-weight: 600; color: #c05621; font-size: 1rem; }
    .country-select { padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 8px; background-color: white; font-size: 0.95rem; font-weight: bold; color: #2d3748; outline: none; cursor: pointer; }

    /* Contador de Personas */
    .counter-group { display: flex; align-items: center; justify-content: space-between; background: #ebf8ff; padding: 14px 18px; border-radius: 12px; border: 1px solid #bee3f8; }
    .counter-label { font-weight: 600; color: #2b6cb0; font-size: 1rem; }
    .counter-controls { display: flex; align-items: center; gap: 14px; }
    .btn-counter { background-color: #3182ce; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 22px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.1s; }
    .btn-counter:active { transform: scale(0.95); }
    .btn-counter:disabled { background-color: #cbd5e0; cursor: not-allowed; }
    .counter-value { font-size: 22px; font-weight: bold; width: 32px; text-align: center; color: #2d3748; }

    /* Encabezado del Menú y Botón Aleatorio */
    .section-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 24px; border-bottom: 2px solid #edf2f7; padding-bottom: 8px; }
    .section-header h2 { margin: 0; border: none; padding: 0; }
    .btn-random { background-color: #805ad5; color: white; border: none; padding: 8px 14px; font-size: 0.85rem; font-weight: 600; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.2s, transform 0.1s; }
    .btn-random:active { transform: scale(0.96); background-color: #6b46c1; }

    /* Menú Semanal Responsivo */
    .days-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
    @media (min-width: 600px) { .days-grid { grid-template-columns: 1fr 1fr; } }
    .day-box { background: #f7fafc; padding: 10px 12px; border-radius: 10px; border: 1px solid #e2e8f0; }
    .day-box label { font-weight: 600; display: block; margin-bottom: 4px; color: #4a5568; font-size: 0.9rem; }
    select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 8px; background-color: white; font-size: 0.95rem; color: #2d3748; outline: none; }

    /* Despensa / Checkboxes Móviles */
    .select-all-box { background: #ebf8ff; padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; color: #2b6cb0; border: 1px solid #bee3f8; margin-top: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .select-all-box input { width: 18px; height: 18px; accent-color: #3182ce; cursor: pointer; }
    .checkbox-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
    .checkbox-card { background: #f7fafc; padding: 10px 12px; border-radius: 8px; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; gap: 8px; border: 1px solid #e2e8f0; user-select: none; }
    .checkbox-card input { width: 18px; height: 18px; accent-color: #3182ce; cursor: pointer; }

    /* Botón de Acción */
    .btn-submit { background-color: #38a169; color: white; border: none; padding: 16px; font-size: 1.05rem; font-weight: 700; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 24px; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 12px rgba(56,161,105,0.25); }
    .btn-submit:active { transform: scale(0.98); background-color: #2f855a; }

    /* Spinner de Carga */
    .spinner-container { display: none; text-align: center; margin: 24px 0; }
    .spinner { border: 4px solid #e2e8f0; border-top: 4px solid #38a169; border-radius: 50%; width: 40px; height: 40px; animation: spin 0.8s linear infinite; margin: 0 auto 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner-text { font-size: 0.95rem; color: #4a5568; font-weight: 600; }

    /* Resultados */
    .result-box { margin-top: 24px; padding: 16px; background: #f0fff4; border: 1px solid #c6f6d5; border-radius: 12px; }
    .cost-total { background: #38a169; color: white; padding: 12px 16px; border-radius: 10px; display: block; text-align: center; font-size: 1.15rem; font-weight: 700; margin-top: 16px; }
    ul { padding-left: 20px; margin: 8px 0; }
    li { margin-bottom: 6px; font-size: 0.95rem; }

    /* Sugerencias y Cantidades */
    .prep-box { margin-top: 24px; padding: 16px; background: #fffaf0; border: 1px solid #feebc8; border-radius: 12px; }
    .prep-card { background: #ffffff; padding: 14px; border-radius: 10px; margin-bottom: 18px; border-left: 4px solid #ed8936; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    .prep-card:last-child { margin-bottom: 0; }
    .prep-day { font-weight: 700; color: #dd6b20; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .prep-dish { font-weight: 700; color: #2d3748; font-size: 1.1rem; margin: 2px 0 8px 0; }
    
    /* Estilo de Imagen Referencial por URL */
    .dish-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin: 8px 0 12px 0; border: 1px solid #e2e8f0; }

    .prep-quantities { font-size: 0.88rem; background: #edf2f7; padding: 10px 12px; border-radius: 6px; margin-bottom: 10px; color: #4a5568; line-height: 1.5; }
    .prep-pre { background: #feebc8; color: #7b341e; padding: 8px 12px; border-radius: 6px; font-size: 0.88rem; font-weight: 600; margin-bottom: 10px; display: block; border-left: 3px solid #dd6b20; }
    .prep-desc { font-size: 0.92rem; color: #2d3748; line-height: 1.55; background: #faf5ff; padding: 12px; border-radius: 8px; border: 1px solid #e9d8fd; }
  </style>
</head>
<body>

<div class="container">
  <h1>Planificador de comida semanal</h1>
  
  <!-- Selección de País -->
  <div class="country-group">
    <span class="country-label">🌎 Selección de País:</span>
    <select id="selectPais" class="country-select" onchange="cambiarPais()">
      <option value="PE">🇵🇪 Perú (S/ PEN)</option>
      <option value="AR">🇦🇷 Argentina ($ ARS)</option>
    </select>
  </div>

  <!-- Personas -->
  <div class="counter-group">
    <span class="counter-label">👥 Cantidad de personas:</span>
    <div class="counter-controls">
      <button class="btn-counter" id="btnMinus" onclick="cambiarPersonas(-1)">−</button>
      <span class="counter-value" id="cantPersonas">4</span>
      <button class="btn-counter" id="btnPlus" onclick="cambiarPersonas(1)">+</button>
    </div>
  </div>

  <!-- Menú Semanal con Botón Aleatorio -->
  <div class="section-header">
    <h2>📅 Menú Semanal</h2>
    <button class="btn-random" onclick="seleccionarAleatorio()">🎲 Seleccionar Platos Aleatoriamente</button>
  </div>
  <div class="days-grid">
    <div class="day-box"><label>Lunes:</label><select id="lunes" class="select-plato"></select></div>
    <div class="day-box"><label>Martes:</label><select id="martes" class="select-plato"></select></div>
    <div class="day-box"><label>Miércoles:</label><select id="miercoles" class="select-plato"></select></div>
    <div class="day-box"><label>Jueves:</label><select id="jueves" class="select-plato"></select></div>
    <div class="day-box"><label>Viernes:</label><select id="viernes" class="select-plato"></select></div>
    <div class="day-box"><label>Sábado:</label><select id="sabado" class="select-plato"></select></div>
    <div class="day-box"><label>Domingo:</label><select id="domingo" class="select-plato"></select></div>
  </div>

  <!-- Despensa -->
  <h2>🥫 ¿Qué ingredientes YA tienes en casa?</h2>
  <label class="select-all-box">
    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)">
    <span>☑️ Marcar / Desmarcar todos</span>
  </label>

  <div class="checkbox-grid">
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="arroz" onchange="actualizarEstadoSelectAll()"> Arroz</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="aceite" onchange="actualizarEstadoSelectAll()"> Aceite</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="sal" onchange="actualizarEstadoSelectAll()"> Sal</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="pimienta" onchange="actualizarEstadoSelectAll()"> Pimienta</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="comino" onchange="actualizarEstadoSelectAll()"> Comino</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="azucar" onchange="actualizarEstadoSelectAll()"> Azúcar</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="fideos" onchange="actualizarEstadoSelectAll()"> Fideos</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="atun" onchange="actualizarEstadoSelectAll()"> Atún en lata</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="lenteja_id" onchange="actualizarEstadoSelectAll()"> Lentejas</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="frejol_id" onchange="actualizarEstadoSelectAll()"> Fréjol / Porotos</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="hamburguesa" onchange="actualizarEstadoSelectAll()"> Hamburguesas</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="nuggets" onchange="actualizarEstadoSelectAll()"> Nuggets</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="leche" onchange="actualizarEstadoSelectAll()"> Leche</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="mantequilla" onchange="actualizarEstadoSelectAll()"> Mantequilla / Manteca</label>
    <label class="checkbox-card"><input type="checkbox" class="despensa" value="galleta_soda" onchange="actualizarEstadoSelectAll()"> Galleta Soda / Tostadas</label>
  </div>

  <button class="btn-submit" onclick="ejecutarGeneracion()">Generar Lista y Sugerencias</button>

  <!-- Spinner de Carga -->
  <div id="spinner" class="spinner-container">
    <div class="spinner"></div>
    <div class="spinner-text">Calculando ingredientes y organizando recetas...</div>
  </div>

  <!-- Lista de Compras -->
  <div id="resultado" class="result-box" style="display:none;">
    <h2 style="margin-top:0; border:none; color:#276749;">🛒 Lista de Compras Semanal</h2>
    <div id="lista-ingredientes"></div>
    <div class="cost-total">Estimado de Gastos: <span id="costo-total">S/ 0.00</span></div>
  </div>

  <!-- Sugerencias de Preparación -->
  <div id="seccion-sugerencias" class="prep-box" style="display:none;">
    <h2 style="margin-top:0; border:none; color:#c05621;">🍳 Guía de Preparación e Insumos por Plato</h2>
    <div id="lista-sugerencias"></div>
  </div>
</div>

  function obtenerCatalogoActual() {
    return paisActual === "PE" ? CatPlatosPeru : CatPlatosArgentina;
  }

  function cambiarPais() {
    paisActual = document.getElementById('selectPais').value;
    
    // Guardar selección de plato actual si existe
    const seleccionesPrevias = {};
    const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
    dias.forEach(d => {
      const el = document.getElementById(d);
      if (el) seleccionesPrevias[d] = el.value;
    });

    cargarOpcionesPlatos();

    // Reasignar selecciones
    dias.forEach(d => {
      if (seleccionesPrevias[d]) {
        document.getElementById(d).value = seleccionesPrevias[d];
      }
    });

    if (document.getElementById('resultado').style.display !== 'none') {
      generarPlanificacion();
    }
  }

  function cargarOpcionesPlatos() {
    const catalog = obtenerCatalogoActual();
    const selectores = document.querySelectorAll('.select-plato');
    selectores.forEach(select => {
      select.innerHTML = '';
      for (const [key, item] of Object.entries(catalog)) {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = item.nombre;
        select.appendChild(option);
      }
    });

    if (!document.getElementById('lunes').value) {
      document.getElementById('lunes').value = 'lentejas_pescado';
      document.getElementById('martes').value = 'carne_papas';
      document.getElementById('miercoles').value = 'pollo_plancha';
      document.getElementById('jueves').value = 'frejol_atun';
      document.getElementById('viernes').value = 'pure_broaster';
      document.getElementById('sabado').value = 'tallarin_verde';
      document.getElementById('domingo').value = 'ninguno';
    }
  }

  function toggleSelectAll(masterCheckbox) {
    const checkboxes = document.querySelectorAll('.despensa');
    checkboxes.forEach(cb => {
      cb.checked = masterCheckbox.checked;
    });
  }

  function actualizarEstadoSelectAll() {
    const checkboxes = document.querySelectorAll('.despensa');
    const masterCheckbox = document.getElementById('selectAllCheckbox');
    const todosMarcados = Array.from(checkboxes).every(cb => cb.checked);
    masterCheckbox.checked = todosMarcados;
  }

  function seleccionarAleatorio() {
    const catalog = obtenerCatalogoActual();
    const opcionesValidas = Object.keys(catalog).filter(k => k !== 'ninguno');
    
    const copiaOpciones = [...opcionesValidas];
    for (let i = copiaOpciones.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copiaOpciones[i], copiaOpciones[j]] = [copiaOpciones[j], copiaOpciones[i]];
    }

    const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
    dias.forEach((dia, index) => {
      document.getElementById(dia).value = copiaOpciones[index];
    });
  }

  function cambiarPersonas(delta) {
    personas += delta;
    if (personas < minPersonas) personas = minPersonas;
    if (personas > maxPersonas) personas = maxPersonas;

    document.getElementById('cantPersonas').innerText = personas;
    document.getElementById('btnMinus').disabled = (personas === minPersonas);
    document.getElementById('btnPlus').disabled = (personas === maxPersonas);
  }

  function formatearCantidad(cant, unidad) {
    if (cant >= 1000 && unidad === 'g') {
      return (cant / 1000).toFixed(2) + ' kg';
    }
    if (unidad === 'unid' || unidad === 'lata' || unidad === 'litro') {
      return (cant < 1 && unidad === 'litro' ? cant.toFixed(2) : Math.ceil(cant)) + ' ' + unidad;
    }
    return Math.round(cant) + ' ' + unidad;
  }

  function ejecutarGeneracion() {
    document.getElementById('resultado').style.display = 'none';
    document.getElementById('seccion-sugerencias').style.display = 'none';
    document.getElementById('spinner').style.display = 'block';

    setTimeout(() => {
      document.getElementById('spinner').style.display = 'none';
      generarPlanificacion();
    }, 800);
  }

  function generarPlanificacion() {
    const catalog = obtenerCatalogoActual();
    const simboloMoneda = paisActual === "PE" ? "S/" : "$";
    const ignorar = [];
    document.querySelectorAll('.despensa:checked').forEach(e => ignorar.push(e.value));

    const dias = ['lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado', 'domingo'];
    let compras = {};
    let costoTotal = 0;
    let platosSeleccionados = [];

    dias.forEach(dia => {
      const platoKey = document.getElementById(dia).value;
      if (platoKey !== 'ninguno' && catalog[platoKey]) {
        const plato = catalog[platoKey];
        platosSeleccionados.push({ dia: dia.charAt(0).toUpperCase() + dia.slice(1), ...plato });

        plato.ingredientes.forEach(ing => {
          if (ignorar.includes(ing.id)) return;

          const cantidadTotal = ing.cant * personas;
          const costoIngrediente = cantidadTotal * ing.precioUnit;

          if (!compras[ing.nombre]) {
            compras[ing.nombre] = { cant: 0, unidad: ing.unidad, costo: 0 };
          }
          compras[ing.nombre].cant += cantidadTotal;
          compras[ing.nombre].costo += costoIngrediente;
          costoTotal += costoIngrediente;
        });
      }
    });

    // Renderizar Lista de Compras
    let htmlCompras = '<ul>';
    for (const [nombre, data] of Object.entries(compras)) {
      htmlCompras += `<li><strong>${nombre}:</strong> ${formatearCantidad(data.cant, data.unidad)} — <em>${simboloMoneda} ${data.costo.toFixed(2)}</em></li>`;
    }
    htmlCompras += '</ul>';

    document.getElementById('lista-ingredientes').innerHTML = htmlCompras;
    document.getElementById('costo-total').innerText = `${simboloMoneda} ${costoTotal.toFixed(2)}`;
    document.getElementById('resultado').style.display = 'block';

    // Renderizar con el orden: Insumos exactos -> Tarea previa -> Pasos de Preparación
    let htmlSugerencias = '';
    if (platosSeleccionados.length === 0) {
      htmlSugerencias = '<p>No has seleccionado ningún plato para la semana.</p>';
    } else {
      platosSeleccionados.forEach(item => {
        let listaInsumosPlato = item.ingredientes.map(ing => {
          let cantCalculada = ing.cant * personas;
          return `<b>${ing.nombre}:</b> ${formatearCantidad(cantCalculada, ing.unidad)}`;
        }).join(' • ');

        htmlSugerencias += `
          <div class="prep-card">
            <div class="prep-day">📌 ${item.dia}</div>
            <div class="prep-dish">${item.nombre}</div>
            ${item.imagen ? `<img src="${item.imagen}" alt="${item.nombre}" class="dish-img" loading="lazy" onerror="this.style.display='none'">` : ''}
            
            <!-- 1. Insumos exactos -->
            <div class="prep-quantities"><strong>Insumos exactos para ${personas} personas:</strong><br>${listaInsumosPlato}</div>
            
            <!-- 2. Tarea previa -->
            ${item.sugerenciaPrevia ? `<div class="prep-pre">${item.sugerenciaPrevia}</div>` : ''}
            
            <!-- 3. Pasos de Preparación -->
            <div class="prep-desc"><strong>Pasos de Preparación:</strong><br>${item.preparacion}</div>
          </div>
        `;
      });
    }

    document.getElementById('lista-sugerencias').innerHTML = htmlSugerencias;
    document.getElementById('seccion-sugerencias').style.display = 'block';
  }

  window.onload = function() {
    cargarOpcionesPlatos();
    cambiarPersonas(0);
  };
</script>

</body>
</html>
